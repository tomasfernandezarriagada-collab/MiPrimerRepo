<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <strong><h1>Crea una cuenta en discord</h1></strong>

    <div
    <h3>Nombre:</h3> 
    <input type="text" placeholder="Nombre" name="nombre" id="nombre">
</div>

<br>

<div
    <h3>Apellido:</h3> 
    <input type="text" placeholder="Apellido" name="apellido" id="apellido">
</div>

<br>

<div
    <h3>Correo:</h3> 
    <input type="email" placeholder="Correo" name="correo" id="correo"> 
</div>

<br>

<div
    <h3>Contraseña:</h3> 
    <input type="password" placeholder="Contraseña" name="contraseña" id="contraseña">
</div>

<br>

<div
    <h3>Confirmar contraseña:</h3> 
    <input type="password" placeholder="Confirmar contraseña" name="confirmarContraseña" id="confirmarContraseña">  
</div>

<br>

<div
    <h3>Fecha de nacimiento:</h3> 
    <input type="date" name="fechaNacimiento" id="fechaNacimiento">
</div>

<br>

<div
    <h3>Género:</h3> 
    <input type="radio" name="genero" value="masculino"> Masculino
    <input type="radio" name="genero" value="femenino"> Femenino
    <input type="radio" name="genero" value="otro"> Otro
</div>

<br>

<div
    <h3>Descripción sobre ti:</h3>
    <textarea placeholder="Describe tu experiencia" name="descripcion" id="descripcion"></textarea>
</div>

</body>
</html>
